name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Public Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/my-upload-key.jks" \
            -alias "upload" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "publicpassword" \
            -keypass "publicpassword" \
            -dname "CN=PublicRelease, OU=Trading, O=MetaTraderBubble, L=Global, S=Global, C=US"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: publicpassword
          KEY_PASSWORD: publicpassword
        run: |
          ./gradlew assembleRelease -x lint -x test --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaTrader-Bubble-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
